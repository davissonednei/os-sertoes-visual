<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d">
  <title id="t">Até onde chegaram</title>
  <desc id="d">Mapa-esquema minimalista dos limites do avanço do povoamento descritos por Euclides da Cunha, com nomes históricos em destaque e equivalentes atuais em corpo menor.</desc>

  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#eee5d4"/>
      <path d="M0 7 L20 4 M0 16 L20 13" stroke="#17130f" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a7b67"/>
    </marker>
  </defs>

  <rect width="1448" height="1086" fill="url(#paper)"/>
  <rect x="16" y="16" width="1416" height="1054" fill="none" stroke="#9b907e" stroke-width="1"/>

  <text x="724" y="118" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="500" letter-spacing="11"
        fill="#9a4528">ATÉ ONDE CHEGARAM</text>
  <text x="724" y="164" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19" letter-spacing="4"
        fill="#2a2b29">O POVOAMENTO ESTACA NAS BORDAS</text>

  <!-- orientação -->
  <g transform="translate(1330 205)" font-family="Arial, Helvetica, sans-serif" fill="#17130f">
    <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="900">N</text>
    <path d="M0 0 L-6 20 L0 16 L6 20 Z" fill="#17130f"/>
    <line x1="0" y1="16" x2="0" y2="42" stroke="#17130f" stroke-width="2"/>
  </g>

  <!-- São Francisco -->
  <path d="M105 317
           C260 270 420 244 600 252
           C770 260 925 286 1057 319
           C1160 345 1235 373 1340 419"
        fill="none" stroke="#31483c" stroke-width="13"
        stroke-linecap="round"/>
  <text x="555" y="226"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24" letter-spacing="5"
        fill="#31483c"
        stroke="#eee5d4" stroke-width="8" paint-order="stroke">SÃO FRANCISCO</text>

  <!-- Itapicuru: referência sul -->
  <path d="M90 930 C350 905 635 923 880 928 C1062 932 1218 911 1360 875"
        fill="none" stroke="#a14e2b" stroke-width="8"
        stroke-linecap="round"/>
  <text x="1030" y="970"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="600" letter-spacing="4"
        fill="#a14e2b"
        stroke="#eee5d4" stroke-width="8" paint-order="stroke">ITAPICURU</text>

  <!-- linhas discretas de avanço; terminam nos núcleos -->
  <g fill="none" stroke="#8a7b67" stroke-width="3" stroke-dasharray="4 10"
     stroke-linecap="round" marker-end="url(#arrow)" opacity=".62">
    <path d="M720 1030 C700 960 690 900 682 846"/>
    <path d="M1010 1030 C1035 965 1060 900 1090 830"/>
    <path d="M190 965 C205 900 232 838 278 780 C330 716 385 657 444 598"/>
  </g>

  <!-- Capim Grosso / Curaçá -->
  <g>
    <circle cx="235" cy="291" r="8" fill="#17130f"/>
    <text x="235" y="344" text-anchor="middle"
          font-family="Georgia, serif" font-size="21" font-weight="700" fill="#17130f">Capim Grosso</text>
    <text x="235" y="368" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" fill="#8a7b67">ATUAL CURAÇÁ</text>
  </g>

  <!-- Santo Antônio da Glória / Glória -->
  <g>
    <circle cx="1190" cy="363" r="8" fill="#17130f"/>
    <text x="1190" y="414" text-anchor="middle"
          font-family="Georgia, serif" font-size="21" font-weight="700" fill="#17130f">Santo Antônio da Glória</text>
    <text x="1190" y="438" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" fill="#8a7b67">ATUAL GLÓRIA</text>
  </g>

  <!-- Uauá -->
  <g>
    <circle cx="452" cy="570" r="8" fill="#9a4528"/>
    <text x="425" y="560" text-anchor="end"
          font-family="Georgia, serif" font-size="23" font-weight="700" fill="#17130f">Uauá</text>
  </g>

  <!-- Itiúba -->
  <g>
    <path d="M202 786 L228 750 L253 784 L280 744 L309 787"
          fill="none" stroke="#655d52" stroke-width="4" stroke-linejoin="round"/>
    <text x="255" y="825" text-anchor="middle"
          font-family="Georgia, serif" font-size="20" fill="#655d52">Itiúba</text>
  </g>

  <!-- Monte Santo -->
  <g>
    <circle cx="590" cy="742" r="8" fill="#9a4528"/>
    <text x="590" y="711" text-anchor="middle"
          font-family="Georgia, serif" font-size="22" font-weight="700" fill="#17130f">Monte Santo</text>
  </g>

  <!-- Cumbe / Euclides da Cunha -->
  <g>
    <circle cx="758" cy="786" r="8" fill="#9a4528"/>
    <text x="758" y="756" text-anchor="middle"
          font-family="Georgia, serif" font-size="22" font-weight="700" fill="#17130f">Cumbe</text>
    <text x="758" y="826" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4" fill="#8a7b67">ATUAL EUCLIDES DA CUNHA</text>
  </g>

  <!-- Maçacará / Massacará -->
  <g>
    <circle cx="665" cy="858" r="8" fill="#9a4528"/>
    <text x="630" y="853" text-anchor="end"
          font-family="Georgia, serif" font-size="21" font-weight="700" fill="#17130f">Maçacará</text>
    <text x="630" y="875" text-anchor="end"
          font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3" fill="#8a7b67">ATUAL MASSACARÁ</text>
  </g>

  <!-- Bom Conselho / Cícero Dantas -->
  <g>
    <circle cx="1107" cy="800" r="8" fill="#9a4528"/>
    <text x="1107" y="767" text-anchor="middle"
          font-family="Georgia, serif" font-size="22" font-weight="700" fill="#17130f">Bom Conselho</text>
    <text x="1107" y="840" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4" fill="#8a7b67">ATUAL CÍCERO DANTAS</text>
  </g>

  <text x="94" y="1020"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" letter-spacing="2"
        fill="#8a7b67">ESQUEMA DE POSIÇÕES RELATIVAS · NOMES HISTÓRICOS EM DESTAQUE</text>
</svg>