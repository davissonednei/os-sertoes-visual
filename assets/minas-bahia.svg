<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" role="img" aria-labelledby="t d">
<title id="t">Minas — Bahia</title>
<desc id="d">Mapa editorial ligando Minas Gerais à Bahia, com referências ao Espinhaço e à região diamantina.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1.2" opacity=".17"/>
  </pattern>
</defs>

<rect width="860" height="700" fill="url(#paper)"/>
<text x="55" y="66" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#963e27">MINAS — BAHIA</text>

<!-- eixo visual -->
<path d="M176 542 C220 450 270 385 335 332 C406 273 466 225 520 170 C565 125 610 101 670 82"
      fill="none" stroke="#17130f" stroke-width="12" stroke-linecap="round"/>
<path d="M176 542 C220 450 270 385 335 332 C406 273 466 225 520 170 C565 125 610 101 670 82"
      fill="none" stroke="#963e27" stroke-width="4" stroke-dasharray="2 15" stroke-linecap="round"/>

<!-- relevo de apoio -->
<g fill="url(#hatch)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
  <path d="M82 470 L136 405 L191 452 L244 388 L301 446 Z"/>
  <path d="M505 178 L550 128 L595 171 L640 121 L692 174 L735 139 L780 185 Z"/>
</g>

<!-- pontos -->
<circle cx="176" cy="542" r="10" fill="#963e27"/>
<circle cx="670" cy="82" r="10" fill="#963e27"/>

<!-- rótulos principais -->
<text x="84" y="596" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" fill="#17130f">MINAS GERAIS</text>
<text x="620" y="45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" fill="#17130f">BAHIA</text>

<!-- rótulos de apoio, afastados da linha -->
<text x="84" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#655d52">Espinhaço · quartzitos · ouro</text>
<text x="520" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#655d52">Sincorá · região diamantina · chapadas</text>
</svg>