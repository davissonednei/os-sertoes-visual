<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" role="img" aria-labelledby="t d">
<title id="t">Um mapa para entrar no sertão</title>
<desc id="d">Esquema regional do nordeste da Bahia com o rio São Francisco, Itiúba, Monte Santo, Jeremoabo e Paulo Afonso em posições relativas aproximadas.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1.2" opacity=".17"/>
  </pattern>
</defs>

<rect width="1300" height="780" fill="url(#paper)"/>

<text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#963e27">UM MAPA PARA ENTRAR NO SERTÃO</text>
<text x="73" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3" fill="#655d52">ESQUEMA REGIONAL · POSIÇÕES RELATIVAS APROXIMADAS</text>

<!-- orientação -->
<g transform="translate(1185 84)" font-family="Arial, Helvetica, sans-serif" fill="#17130f">
  <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="900">N</text>
  <path d="M0 0 L-7 22 L0 17 L7 22 Z" fill="#17130f"/>
  <line x1="0" y1="17" x2="0" y2="46" stroke="#17130f" stroke-width="2"/>
</g>

<!-- São Francisco: ao norte dos núcleos urbanos e infletindo para leste -->
<path d="M105 225
         C250 190 415 172 585 178
         C735 183 855 198 930 219
         C978 232 1015 243 1047 241
         C1090 238 1138 217 1205 197"
      fill="none" stroke="#31483c" stroke-width="14" stroke-linecap="round"/>
<text x="250" y="154" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#31483c">RIO SÃO FRANCISCO</text>

<!-- serras e chapadas: símbolos separados para não fingir uma cordilheira contínua -->
<g fill="url(#hatch)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
  <!-- Serra da Itiúba -->
  <path d="M150 548 L185 502 L219 540 L252 493 L289 543 L321 510 L354 550 Z"/>
  <!-- Monte Santo -->
  <path d="M407 503 L441 462 L474 500 L506 454 L541 501 L572 469 L603 508 Z"/>
  <!-- Chapadas de Jeremoabo -->
  <path d="M825 392 L861 350 L895 389 L929 347 L965 393 L999 360 L1032 399 Z"/>
</g>

<!-- fragmentação do relevo descrita por Euclides: duas direções, não uma rota -->
<g fill="none" stroke-linecap="round">
  <path d="M235 565 C315 548 390 534 483 538"
        stroke="#17130f" stroke-width="7" opacity=".88"/>
  <path d="M235 565 C315 548 390 534 483 538"
        stroke="#963e27" stroke-width="2.8" stroke-dasharray="2 13"/>

  <path d="M235 565 C430 520 630 475 810 445 C895 430 963 386 1047 241"
        stroke="#17130f" stroke-width="7" opacity=".88"/>
  <path d="M235 565 C430 520 630 475 810 445 C895 430 963 386 1047 241"
        stroke="#963e27" stroke-width="2.8" stroke-dasharray="2 13"/>
</g>

<!-- pontos geográficos -->
<g font-family="Arial, Helvetica, sans-serif" fill="#17130f">
  <circle cx="224" cy="612" r="9" fill="#963e27"/>
  <text x="249" y="619" font-size="18" font-weight="800">ITIÚBA</text>

  <circle cx="483" cy="538" r="9" fill="#963e27"/>
  <text x="508" y="545" font-size="18" font-weight="800">MONTE SANTO</text>

  <circle cx="980" cy="434" r="9" fill="#963e27"/>
  <text x="1005" y="441" font-size="18" font-weight="800">JEREMOABO</text>

  <circle cx="1047" cy="241" r="9" fill="#963e27"/>
  <text x="1072" y="248" font-size="18" font-weight="800">PAULO AFONSO</text>
</g>

<!-- nomes do relevo, deliberadamente afastados dos pontos -->
<g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing=".7" fill="#655d52">
  <text x="145" y="480">SERRA DA ITIÚBA</text>
  <text x="408" y="438">MONTE SANTO</text>
  <text x="820" y="332">CHAPADAS DE JEREMOABO</text>
</g>

<!-- legenda editorial -->
<g transform="translate(72 700)" font-family="Arial, Helvetica, sans-serif" fill="#655d52">
  <line x1="0" y1="0" x2="52" y2="0" stroke="#31483c" stroke-width="8" stroke-linecap="round"/>
  <text x="66" y="5" font-size="13">São Francisco</text>

  <line x1="205" y1="0" x2="257" y2="0" stroke="#17130f" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="0" x2="257" y2="0" stroke="#963e27" stroke-width="2.5" stroke-dasharray="2 11" stroke-linecap="round"/>
  <text x="271" y="5" font-size="13">fragmentos do eixo do relevo</text>

  <circle cx="520" cy="0" r="7" fill="#963e27"/>
  <text x="535" y="5" font-size="13">localidades</text>
</g>
</svg>