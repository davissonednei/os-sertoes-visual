<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="t d">
<title id="t">Transição para a entrada do sertão</title>
<desc id="d">Esquema regional ligando São Francisco, Itiúba, Monte Santo, Jeremoabo e Paulo Afonso.</desc>
<rect width="1300" height="760" fill="#ebe3d4"/>
<text x="70" y="70" font-family="Arial" font-weight="800" font-size="22" letter-spacing="4" fill="#963e27">O CAMPO DE VISÃO SE ESTREITA</text>

