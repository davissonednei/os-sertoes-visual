  <text x="420" y="357">ITIÚBA</text>

  <circle cx="600" cy="638" r="9" fill="#963e27"/>
  <text x="620" y="645">MONTE SANTO</text>

  <circle cx="850" cy="385" r="9" fill="#963e27"/>
  <text x="875" y="392">JEREMOABO</text>

  <circle cx="1092" cy="327" r="9" fill="#963e27"/>
