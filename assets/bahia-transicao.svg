<text x="1020" y="505" font-family="Arial" font-size="14" letter-spacing="2" fill="#31483c">PARA LESTE</text>

<rect x="70" y="600" width="1160" height="95" fill="#963e27" opacity=".06"/>
<text x="95" y="638" font-family="Georgia" font-size="23" fill="#17130f">Brasil → Minas → Bahia → São Francisco → Itiúba → Monte Santo → Jeremoabo → Paulo Afonso</text>
<text x="95" y="674" font-family="Arial" font-size="14" fill="#655d52">É assim que Preliminares vai reduzindo a escala antes de “A entrada do sertão”.</text>
