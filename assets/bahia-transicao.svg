<g font-family="Arial" font-size="17" fill="#17130f">
  <circle cx="420" cy="270" r="8" fill="#963e27"/><text x="438" y="276">ITIÚBA</text>
  <circle cx="565" cy="365" r="8" fill="#963e27"/><text x="583" y="371">MONTE SANTO</text>
  <circle cx="770" cy="335" r="8" fill="#963e27"/><text x="788" y="341">JEREMOABO</text>
  <circle cx="1035" cy="305" r="8" fill="#963e27"/><text x="1053" y="311">PAULO AFONSO</text>
</g>

<path d="M385 225L420 180L455 222L490 174L530 220" fill="none" stroke="#17130f" stroke-width="5"/>
<path d="M510 335L550 290L590 333L625 286L665 330" fill="none" stroke="#17130f" stroke-width="5"/>
