<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" role="img" aria-labelledby="t d">
<title id="t">Um mapa para entrar no sertão</title>
<desc id="d">Mapa editorial com São Francisco, Itiúba, Monte Santo, Jeremoabo e Paulo Afonso.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1.2" opacity=".17"/>
  </pattern>
</defs>

<rect width="1300" height="780" fill="url(#paper)"/>
<text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#963e27">UM MAPA PARA ENTRAR NO SERTÃO</text>

<path d="M135 135 C225 175 290 230 325 308 C360 386 418 446 515 485 C625 529 760 541 900 510 C1015 484 1115 440 1215 380"
