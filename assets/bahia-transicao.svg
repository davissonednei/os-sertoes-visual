<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" role="img" aria-labelledby="t d">
<title id="t">Um mapa para entrar no sertão</title>
<desc id="d">Mapa editorial com São Francisco, Itiúba, Monte Santo, Jeremoabo e Paulo Afonso.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1.2" opacity=".17"/>
  </pattern>
</defs>

<rect width="1300" height="780" fill="url(#paper)"/>
<text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#963e27">UM MAPA PARA ENTRAR NO SERTÃO</text>

<!-- São Francisco, como referência geográfica -->
<path d="M135 135 C225 175 290 230 325 308 C360 386 418 446 515 485 C625 529 760 541 900 510 C1015 484 1115 440 1215 380"
      fill="none" stroke="#31483c" stroke-width="15" stroke-linecap="round"/>
<text x="145" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#31483c">SÃO FRANCISCO</text>

<!-- serras em linguagem próxima ao mapa Minas–Bahia -->
<g fill="url(#hatch)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
  <path d="M285 300 L330 250 L374 296 L418 246 L466 301 L510 262 L555 306 Z"/>
  <path d="M500 470 L550 414 L600 466 L648 408 L700 464 L747 418 L795 470 Z"/>
  <path d="M760 316 L804 267 L848 313 L891 265 L940 318 L983 280 L1028 323 Z"/>
</g>

<!-- pontos e nomes: todos afastados das serras -->
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17130f">
  <circle cx="395" cy="350" r="9" fill="#963e27"/>
  <text x="420" y="357">ITIÚBA</text>

  <circle cx="600" cy="525" r="9" fill="#963e27"/>
  <text x="625" y="532">MONTE SANTO</text>

  <circle cx="850" cy="385" r="9" fill="#963e27"/>
  <text x="875" y="392">JEREMOABO</text>

  <circle cx="1092" cy="327" r="9" fill="#963e27"/>
  <text x="1117" y="334">PAULO AFONSO</text>
</g>

<!-- caminho editorial discreto, no mesmo espírito do mapa Minas–Bahia -->
<path d="M395 350 C470 395 520 470 600 525 C690 475 760 420 850 385 C940 360 1015 338 1092 327"
      fill="none" stroke="#17130f" stroke-width="8" stroke-linecap="round" opacity=".90"/>
<path d="M395 350 C470 395 520 470 600 525 C690 475 760 420 850 385 C940 360 1015 338 1092 327"
      fill="none" stroke="#963e27" stroke-width="3" stroke-dasharray="2 13" stroke-linecap="round"/>
</svg>