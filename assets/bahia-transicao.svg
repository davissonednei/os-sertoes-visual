<text x="96" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#31483c">SÃO FRANCISCO</text>

<g fill="url(#hatch)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
  <path d="M323 300 L368 250 L412 296 L456 246 L504 301 L548 262 L593 306 Z"/>
