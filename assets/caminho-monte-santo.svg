<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 900" role="img" aria-labelledby="t d">
  <title id="t">Em caminho para Monte Santo</title>
  <desc id="d">Esquema horizontal minimalista da saída de Queimadas rumo a Monte Santo, mostrando o Itapicuru, o Jacurici, terreno arenoso e plano e tabuleiros rasos.</desc>

  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#eee5d4"/>
      <path d="M0 7 L20 4 M0 16 L20 13" stroke="#17130f" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9a4528"/>
    </marker>
  </defs>

  <rect width="1448" height="900" fill="url(#paper)"/>
  <rect x="16" y="16" width="1416" height="868" fill="none" stroke="#9b907e" stroke-width="1"/>

  <text x="724" y="112" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="53" font-weight="500" letter-spacing="10"
        fill="#9a4528">EM CAMINHO PARA MONTE SANTO</text>

  <text x="724" y="156" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19" letter-spacing="4"
        fill="#2a2b29">A TRAVESSIA, A PRINCÍPIO, É FÁCIL</text>

  <!-- linha de viagem -->
  <path d="M180 650
           C320 600 430 554 548 512
           C675 467 793 425 915 380
           C1040 334 1135 292 1260 245"
        fill="none" stroke="#9a4528" stroke-width="5"
        stroke-dasharray="7 13" stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- Queimadas -->
  <circle cx="180" cy="650" r="10" fill="#17130f"/>
  <text x="180" y="700" text-anchor="middle"
        font-family="Georgia, serif" font-size="25" font-weight="700" fill="#17130f">Queimadas</text>
  <text x="180" y="727" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#8a7b67">PARTIDA</text>

  <!-- Itapicuru -->
  <path d="M245 565
           C320 540 350 585 426 565
           C500 546 540 590 610 567"
        fill="none" stroke="#31483c" stroke-width="10"
        stroke-linecap="round"/>
  <text x="420" y="522" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22" letter-spacing="4"
        fill="#31483c"
        stroke="#eee5d4" stroke-width="8" paint-order="stroke">ITAPICURU</text>

  <!-- vegetação mais viva no Itapicuru -->
  <g stroke="#5b6a4f" stroke-width="3" stroke-linecap="round">
    <path d="M285 551 l-8 -18 M285 551 l8 -18 M336 563 l-7 -17 M336 563 l9 -18"/>
    <path d="M470 557 l-8 -18 M470 557 l8 -18 M525 573 l-8 -18 M525 573 l9 -18"/>
  </g>

  <!-- Jacurici -->
  <path d="M625 488
           C690 470 720 503 784 485
           C841 469 871 491 919 476"
        fill="none" stroke="#31483c" stroke-width="7"
        stroke-linecap="round"/>
  <text x="774" y="447" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20" letter-spacing="3.5"
        fill="#31483c"
        stroke="#eee5d4" stroke-width="7" paint-order="stroke">JACURICI</text>

  <!-- pequenas matas nas barrancas -->
  <g fill="#5b6a4f" opacity=".9">
    <circle cx="665" cy="470" r="11"/><circle cx="680" cy="466" r="9"/><circle cx="694" cy="472" r="10"/>
    <circle cx="844" cy="466" r="11"/><circle cx="858" cy="461" r="9"/><circle cx="872" cy="468" r="10"/>
  </g>

  <!-- terreno plano/arenoso -->
  <path d="M420 690 C600 678 770 684 940 677 C1080 671 1185 678 1290 669"
        fill="none" stroke="#b9a98e" stroke-width="3"/>
  <path d="M435 711 C620 700 785 707 955 700 C1090 695 1188 702 1285 694"
        fill="none" stroke="#b9a98e" stroke-width="2" opacity=".65"/>

  <text x="825" y="744" text-anchor="middle"
        font-family="Georgia, serif" font-size="21" fill="#655d52">terreno arenoso e plano</text>

  <!-- tabuleiros rasos -->
  <path d="M990 550 L1065 550 L1083 532 L1160 532 L1180 548 L1260 548"
        fill="none" stroke="#655d52" stroke-width="4" stroke-linejoin="round"/>
  <text x="1125" y="590" text-anchor="middle"
        font-family="Georgia, serif" font-size="20" fill="#655d52">tabuleiros rasos</text>

  <!-- destino -->
  <circle cx="1260" cy="245" r="10" fill="#9a4528"/>
  <text x="1260" y="216" text-anchor="middle"
        font-family="Georgia, serif" font-size="25" font-weight="700" fill="#17130f">Monte Santo</text>
  <text x="1175" y="305"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" letter-spacing="2"
        fill="#8a7b67">RUMO NORDESTE</text>

  <!-- ideia-chave -->
  <text x="724" y="820" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="23" font-style="italic"
        fill="#5d554a">“não se surpreende a princípio”</text>
</svg>