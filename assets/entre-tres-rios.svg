<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" role="img" aria-labelledby="t d">
  <title id="t">Entre três rios</title>
  <desc id="d">Esquema editorial mostrando o sertão enquadrado pelo São Francisco, pelo Itapicuru-açu e pelo Vaza-Barris, com indicação do degrau do planalto e da drenagem caótica.</desc>

  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ebe3d4"/>
      <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1300" height="820" fill="url(#paper)"/>
  <rect x="20" y="20" width="1260" height="780" fill="none" stroke="#b8ad99" stroke-width="1"/>

  <text x="70" y="78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#963e27">ENTRE TRÊS RIOS</text>
  <text x="70" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4" fill="#655d52">SÃO FRANCISCO · ITAPICURU-AÇU · VAZA-BARRIS</text>

  <g transform="translate(95 150)">
    <path d="M180 75
             C270 35 390 30 490 58
             C610 91 705 160 795 160
             C875 159 930 118 985 140
             C1030 158 1068 212 1054 265
