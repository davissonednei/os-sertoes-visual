             C899 478 820 518 730 541
             C603 573 492 563 389 520
             C285 475 207 401 176 321
             C150 253 141 169 180 75 Z"
          fill="url(#hatch)" stroke="#17130f" stroke-width="4" stroke-linejoin="round"/>

    <path d="M224 118
             C345 86 470 86 601 121
             C692 145 782 179 874 190
             C941 198 1005 191 1052 171
             L1052 241
             C996 259 933 264 857 253
             C763 240 676 204 592 184
             C463 153 344 154 243 182 Z"
          fill="#d7ccba" opacity=".75"/>

    <text x="450" y="102" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="1.7" fill="#17130f">DEGRAU DO PLANALTO</text>

    <path d="M164 115
             C243 50 361 18 500 18
             C635 18 760 48 870 87
             C955 117 1016 133 1090 132"
          fill="none" stroke="#31483c" stroke-width="9" stroke-linecap="round"/>

    <text x="112" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#31483c">RIO SÃO FRANCISCO</text>

    <path d="M1030 176
             C1065 216 1078 269 1065 321
             C1047 393 993 468 929 535"
          fill="none" stroke="#31483c" stroke-width="8" stroke-linecap="round"/>

    <text x="930" y="585" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#31483c">ITAPICURU-AÇU</text>

    <path d="M418 178
             C498 182 586 194 668 220
             C744 245 801 274 854 310
             C914 352 962 402 1001 452"
          fill="none" stroke="#963e27" stroke-width="8" stroke-linecap="round"/>

    <text x="560" y="254" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#963e27">VAZA-BARRIS</text>

    <circle cx="705" cy="236" r="7" fill="#17130f"/>
    <text x="720" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#17130f">Jeremoabo</text>

    <circle cx="956" cy="135" r="7" fill="#17130f"/>
    <text x="972" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#17130f">Paulo Afonso</text>

    <g stroke="#655d52" stroke-width="2.4" fill="none" opacity=".7">
      <path d="M365 130 L365 180"/>
      <path d="M515 140 L515 205"/>
      <path d="M670 155 L670 225"/>
      <path d="M822 165 L822 240"/>
    </g>
    <g fill="#655d52" opacity=".7">
      <path d="M359 180 L365 190 L371 180 Z"/>
      <path d="M509 205 L515 215 L521 205 Z"/>
      <path d="M664 225 L670 235 L676 225 Z"/>
      <path d="M816 240 L822 250 L828 240 Z"/>
    </g>

    <text x="295" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.3" fill="#655d52">rampas esbarrancadas</text>

    <g transform="translate(85 430)">
      <rect x="0" y="0" width="425" height="120" rx="3" fill="#ddd1bf" stroke="#17130f" stroke-width="2"/>
      <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="1.6" fill="#963e27">FANTASIA DE CARTÓGRAFO</text>
      <text x="20" y="54" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">Euclides sugere que o Vaza-Barris,</text>
      <text x="20" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">de Jeremoabo para as cabeceiras,</text>
      <text x="20" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">era mal desenhado ou mal conhecido nos mapas.</text>
    </g>

    <g transform="translate(615 440)">
      <rect x="0" y="0" width="355" height="110" rx="3" fill="#ddd1bf" stroke="#17130f" stroke-width="2"/>
      <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="1.6" fill="#963e27">DRENAGEM CAÓTICA</text>
      <text x="20" y="54" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">Num relevo em degrau, a água não se distribui</text>
      <text x="20" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">em equilíbrio. Ela desce em torrentes, abrindo</text>
      <text x="20" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4e4942">vales, cortes e percursos irregulares.</text>
    </g>
  </g>
</svg>