<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d">
  <title id="t">Entre três rios</title>
  <desc id="d">Mapa-esquema minimalista com São Francisco, Vaza-Barris, Itapicuru-açu, Paulo Afonso, Jeremoabo e o degrau do planalto.</desc>

