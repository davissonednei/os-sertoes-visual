<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="t d">
<title id="t">A Bahia no Brasil</title>
<desc id="d">Mapa editorial simplificado do Brasil com a Bahia destacada na costa leste.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#17130f" stroke-width="1.2" opacity=".10"/>
  </pattern>
</defs>

<rect width="900" height="760" fill="url(#paper)"/>
<text x="58" y="58" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#963e27">A BAHIA NO BRASIL</text>

