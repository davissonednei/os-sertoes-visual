<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d">
<title id="t">Dois caminhos da água</title>
<desc id="d">Diagrama simples mostrando um divisor de águas: de um lado para o São Francisco e do outro para o leste, com um segundo quadro sobre água subterrânea em terreno calcário.</desc>
<defs>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#ebe3d4"/>
    <path d="M0 5L18 2M0 14L18 11" stroke="#17130f" stroke-opacity=".035"/>
  </pattern>
</defs>
<rect width="1400" height="800" fill="url(#paper)"/>
<text x="70" y="72" font-family="Arial" font-weight="800" font-size="22" letter-spacing="4" fill="#963e27">A ÁGUA ESCOLHE DOIS CAMINHOS</text>

<!-- quadro principal -->
<g transform="translate(90,135)">
  <path d="M40 275L185 170L325 230L470 85L610 200L735 120L875 230L1015 175L1195 265"
        fill="none" stroke="#17130f" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="470" cy="85" r="9" fill="#963e27"/>
  <text x="402" y="48" font-family="Arial" font-size="15" font-weight="800" letter-spacing="2">DIVISOR DE ÁGUAS</text>

  <path d="M468 96C410 175 320 240 205 330C152 371 115 400 70 455"
        fill="none" stroke="#31483c" stroke-width="9" stroke-linecap="round"/>
  <path d="M70 455l17-34 19 27z" fill="#31483c"/>
  <text x="38" y="505" font-family="Arial" font-size="18" font-weight="900" fill="#31483c">PARA O SÃO FRANCISCO</text>

  <path d="M480 96C560 166 675 228 820 280C955 329 1063 365 1165 430"
        fill="none" stroke="#31483c" stroke-width="9" stroke-linecap="round"/>
  <path d="M1165 430l-36-8 15-22z" fill="#31483c"/>
  <text x="973" y="478" font-family="Arial" font-size="18" font-weight="900" fill="#31483c">PARA O LESTE</text>
</g>

<!-- segundo quadro -->
<g transform="translate(180,590)">
  <rect x="0" y="0" width="1040" height="145" rx="2" fill="#ded2bf" stroke="#17130f" stroke-width="2"/>
  <text x="25" y="32" font-family="Arial" font-size="15" font-weight="900" letter-spacing="2" fill="#963e27">NO CALCÁRIO, A ÁGUA TAMBÉM PODE SUMIR</text>

  <path d="M25 65H1015" stroke="#17130f" stroke-width="3"/>
  <path d="M245 65C262 76 268 89 268 103" fill="none" stroke="#31483c" stroke-width="5"/>
  <path d="M268 103C382 104 443 121 535 119C648 117 751 96 835 88" fill="none" stroke="#31483c" stroke-width="6"/>
  <ellipse cx="555" cy="118" rx="82" ry="22" fill="#17130f"/>
  <text x="520" y="123" font-family="Arial" font-size="12" fill="#f2eee4">CAVERNA</text>

  <text x="185" y="128" font-family="Arial" font-size="13" fill="#655d52">sumidouro</text>
  <text x="805" y="125" font-family="Arial" font-size="13" fill="#655d52">água subterrânea</text>
</g>
</svg>